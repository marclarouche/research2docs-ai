[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research2docs-ai"
version = "0.1.0"
description = "Local technical research and editorial evidence workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3", "streamlit>=1.50,<2", "PyMuPDF>=1.26,<2",
  "python-docx>=1.2,<2", "markdown-it-py>=3,<5", "beautifulsoup4>=4.13,<5", "Jinja2>=3.1.6,<4", "psutil>=6,<8",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "pip-audit>=2.8,<3", "types-psutil"]
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["research2docs*", "ui*"]
[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-m 'not ollama'"
markers = ["ollama: optional real loopback Ollama discovery; enable explicitly"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "ui"]

[tool.setuptools.package-data]
"research2docs.generation" = ["templates/*.json"]
